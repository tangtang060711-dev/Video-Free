# ============================================================================
#  版本目录：全工程唯一的版本来源。任何模块里都不允许出现硬编码版本号。
# ============================================================================
[versions]
agp                = "8.7.3"     # 要求 Gradle >= 8.9
kotlin             = "2.0.21"    # Compose 编译器自 Kotlin 2.0 起独立成插件，版本必须同号
ksp                = "2.0.21-1.0.28"  # KSP 版本必须与 Kotlin 严格同号
hilt               = "2.52"
composeBom         = "2024.12.01"
media3             = "1.9.4"    # 本地 Gradle 缓存已完整存在 1.9.4 的 aar（minCompileSdk=35，正好匹配）
coroutines         = "1.9.0"
lifecycle          = "2.8.7"
activityCompose    = "1.9.3"
coreKtx            = "1.15.0"
okhttp             = "4.12.0"
datastore          = "1.1.1"
hiltNavigation     = "1.2.0"
annotation         = "1.9.1"
junit              = "4.13.2"

[libraries]
# ---------- 基础 ----------
androidx-core-ktx              = { module = "androidx.core:core-ktx",                          version.ref = "coreKtx" }
androidx-annotation            = { module = "androidx.annotation:annotation",                  version.ref = "annotation" }

# ---------- 协程 / 生命周期 ----------
kotlinx-coroutines-core        = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core",    version.ref = "coroutines" }
kotlinx-coroutines-android     = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-test        = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test",    version.ref = "coroutines" }
androidx-lifecycle-runtime-ktx = { module = "androidx.lifecycle:lifecycle-runtime-ktx",         version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-lifecycle-service     = { module = "androidx.lifecycle:lifecycle-service",             version.ref = "lifecycle" }
androidx-lifecycle-process     = { module = "androidx.lifecycle:lifecycle-process",             version.ref = "lifecycle" }

# ---------- Compose（具体版本由 BOM 统一管理）----------
androidx-compose-bom           = { module = "androidx.compose:compose-bom",                     version.ref = "composeBom" }
androidx-compose-ui            = { module = "androidx.compose.ui:ui" }
androidx-compose-ui-graphics   = { module = "androidx.compose.ui:ui-graphics" }
androidx-compose-ui-tooling    = { module = "androidx.compose.ui:ui-tooling" }
androidx-compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
androidx-compose-foundation    = { module = "androidx.compose.foundation:foundation" }
androidx-compose-material3     = { module = "androidx.compose.material3:material3" }
androidx-activity-compose      = { module = "androidx.activity:activity-compose",               version.ref = "activityCompose" }

# ---------- Media3 播放内核 ----------
media3-exoplayer               = { module = "androidx.media3:media3-exoplayer",                 version.ref = "media3" }
media3-exoplayer-hls           = { module = "androidx.media3:media3-exoplayer-hls",             version.ref = "media3" }
media3-exoplayer-dash          = { module = "androidx.media3:media3-exoplayer-dash",            version.ref = "media3" }
media3-ui                      = { module = "androidx.media3:media3-ui",                        version.ref = "media3" }
media3-decoder                 = { module = "androidx.media3:media3-decoder",                   version.ref = "media3" }  # MediaCodec 探测/选择器
media3-extractor               = { module = "androidx.media3:media3-extractor",                 version.ref = "media3" }  # 容器能力探测
media3-datasource              = { module = "androidx.media3:media3-datasource",                version.ref = "media3" }
media3-datasource-okhttp       = { module = "androidx.media3:media3-datasource-okhttp",         version.ref = "media3" }
media3-database                = { module = "androidx.media3:media3-database",                  version.ref = "media3" }  # SimpleCache 需要的 StandaloneDatabaseProvider
media3-session                 = { module = "androidx.media3:media3-session",                   version.ref = "media3" }

# ---------- 依赖注入 ----------
hilt-android                   = { module = "com.google.dagger:hilt-android",                   version.ref = "hilt" }
hilt-compiler                  = { module = "com.google.dagger:hilt-android-compiler",          version.ref = "hilt" }
androidx-hilt-navigation-compose = { module = "androidx.hilt:hilt-navigation-compose",          version.ref = "hiltNavigation" }

# ---------- 数据 ----------
androidx-datastore-preferences = { module = "androidx.datastore:datastore-preferences",         version.ref = "datastore" }
okhttp                         = { module = "com.squareup.okhttp3:okhttp",                      version.ref = "okhttp" }

# ---------- 测试 ----------
junit                          = { module = "junit:junit",                                      version.ref = "junit" }

[plugins]
android-application            = { id = "com.android.application",             version.ref = "agp" }
android-library                = { id = "com.android.library",                 version.ref = "agp" }
kotlin-android                 = { id = "org.jetbrains.kotlin.android",        version.ref = "kotlin" }
kotlin-compose                 = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
ksp                            = { id = "com.google.devtools.ksp",             version.ref = "ksp" }
hilt                           = { id = "com.google.dagger.hilt.android",      version.ref = "hilt" }
