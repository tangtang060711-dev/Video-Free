# ---------- Gradle 构建性能 ----------
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false
# AGP 8.7.3 的 ExtractAnnotations 任务持有 LintTool 句柄，序列化进配置缓存会失败：
# 'field __classpath__ of LintTool bean could not be cached'。关掉它，别和构建工具较劲。

# ---------- AndroidX ----------
android.useAndroidX=true
android.nonTransitiveRClass=true
android.nonFinalResIds=true
# 默认关闭 BuildConfig，需要的模块自己开，减少无谓的代码生成
android.defaults.buildfeatures.buildconfig=false

# ---------- Kotlin ----------
kotlin.code.style=official
kotlin.incremental=true

# ---------- 播放器专属开关 ----------
# 是否把 FFmpeg 软解打进来；release 走 CI 变量覆盖
thermo.enableFfmpeg=true
# 只出这一个 ABI，减小体积
thermo.abiFilter=arm64-v8a
